# CALABATICA CI: her push ve PR'da derle + testleri çalıştır.
# Yayın oluşturmaz (o iş release.yml'de, yalnızca v*.*.* etiketinde).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Uygulamayı derle
        run: dotnet build CyberTodo/CyberTodo.csproj -c Release -warnaserror

      - name: Kaldırıcıyı derle (uygulama paketi gerektirmeyen kurulum derlemesi)
        run: dotnet build Installer/CalabaticaSetup.csproj -c Release -p:UninstallerOnly=true

      - name: Testler (çıkış kodu = başarısız test sayısı)
        run: dotnet run --project tests/CalabaticaTests/CalabaticaTests.csproj -c Release

      # Yayın provası: release.yml'in yaptığını (setup + güncelleme paketi) her PR'da dener ve paketi gerçek
      # güncelleyici koduyla doğrular; bozuk yayın ancak etiket atılınca anlaşılmasın.
      - name: Yayın provası (setup + güncelleme paketi + doğrulama)
        shell: pwsh
        run: |
          ./build-installer.ps1 -Version 0.0.1 -Repository "${{ github.repository }}"
          ./scripts/package-update.ps1 -AppExe artifacts/app/CALABATICA.exe -OutDir artifacts/release
          dotnet run --project tests/CalabaticaTests/CalabaticaTests.csproj -c Release --no-build -- verify-package --dir artifacts/release --setup artifacts/CALABATICA-Setup-0.0.1.exe --version 0.0.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }