# CALABATICA yayın akışı
# Tetik: "v" ile başlayan etiket (ör. git tag v1.1.0 && git push origin v1.1.0)
# Sonuç: GitHub Release +
#   CALABATICA-Setup-<sürüm>.exe  → son kullanıcı kurulumu (ön gereksinim yok)
#   CALABATICA-win-x64.zip (+ .sha256) → ileride otomatik güncellemenin indireceği paket
# Uygulama sürümü etiketten, güncelleme deposu ${{ github.repository }}'den derleme anında gömülür.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # Release oluşturmak için

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Sürümü etiketten al
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Etiket v1.2.3 biçiminde olmalı: ${{ github.ref_name }}" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup + uygulama derle (self-contained tek exe)
        shell: pwsh
        run: ./build-installer.ps1 -Version $env:VERSION -Repository "${{ github.repository }}"

      - name: Güncelleme paketi + SHA256
        shell: pwsh
        run: ./scripts/package-update.ps1 -AppExe artifacts/app/CALABATICA.exe -OutDir .

      - name: Yayın öncesi doğrulama (gerçek güncelleyici koduyla)
        shell: pwsh
        run: |
          dotnet run --project tests/CalabaticaTests/CalabaticaTests.csproj -c Release -- verify-package --dir . --setup "artifacts/CALABATICA-Setup-$env:VERSION.exe" --version $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: GitHub Release oluştur
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "artifacts/CALABATICA-Setup-$env:VERSION.exe" `
            "artifacts/CALABATICA-Setup-$env:VERSION.exe.sha256" `
            CALABATICA-win-x64.zip CALABATICA-win-x64.zip.sha256 `
            --title "CALABATICA ${{ github.ref_name }}" --generate-notes
